<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>GitScope</title><style>:root{--b:#f6f7fb;--c:#fff;--t:#172033;--m:#6d778a;--a:#6857f5;--l:#e7e9f0}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font:14px system-ui}body.dark{--b:#10131d;--c:#181c29;--t:#f5f7ff;--m:#a6afc2;--l:#2a3142}.w{max-width:1200px;margin:auto;padding:0 20px}header{padding:18px 0;border-bottom:1px solid var(--l);position:sticky;top:0;background:var(--b);z-index:2}.top,.hero,.title,.foot{display:flex;align-items:center;gap:15px}.top{justify-content:space-between}.brand{font-size:21px;font-weight:900}.brand b{color:var(--a)}form{display:flex;flex:1;max-width:600px}input,select{border:1px solid var(--l);background:var(--c);color:var(--t);padding:11px;border-radius:9px;outline:none}form input{flex:1;border-radius:9px 0 0 9px}.btn{border:0;background:var(--a);color:#fff;padding:0 17px;border-radius:0 9px 9px 0;font-weight:700;cursor:pointer}.theme{border:1px solid var(--l);background:var(--c);color:var(--t);border-radius:9px;padding:10px;cursor:pointer}.quick{padding:14px 0;color:var(--m)}.quick button{margin:3px;border:1px solid var(--l);background:var(--c);color:var(--t);border-radius:20px;padding:7px 11px;cursor:pointer}.hero{padding:24px 0}.avatar{width:92px;height:92px;border-radius:22px}.hero h1{margin:0;font-size:28px}.muted,p{color:var(--m)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:var(--c);border:1px solid var(--l);border-radius:15px;padding:17px}.stat b{font-size:26px;display:block}.two{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-top:16px}.title{justify-content:space-between;margin-bottom:12px}.title h2{margin:0;font-size:16px}.bars{height:170px;display:flex;gap:11px;align-items:end}.bar{flex:1;background:linear-gradient(#7c6fff,#5140df);border-radius:7px 7px 2px 2px;min-width:15px;position:relative}.bar small{position:absolute;bottom:-18px;color:var(--m);font-size:9px}.pill{display:inline-block;padding:6px 9px;border-radius:20px;background:#6857f51a;color:var(--a);margin:3px}.heat{display:grid;grid-template-columns:repeat(26,1fr);gap:3px}.sq{aspect-ratio:1;background:var(--l);border-radius:2px}.sq.on{background:#21ae82}.repo{padding:14px 0;border-bottom:1px solid var(--l)}.repo h3{margin:0 0 7px}.repo a{color:var(--a);text-decoration:none}.foot{font-size:12px;color:var(--m);flex-wrap:wrap}.dot{width:9px;height:9px;border-radius:9px;background:#f1e05a;display:inline-block}.empty{text-align:center;padding:60px;color:var(--m)}.drawer{position:fixed;right:0;top:0;width:min(590px,100%);height:100%;background:var(--c);z-index:4;padding:24px;overflow:auto;box-shadow:-10px 0 35px #0003;transform:translateX(110%);transition:.25s}.drawer.on{transform:none}pre{white-space:pre-wrap;background:var(--b);padding:14px;border-radius:9px}.close{float:right;border:0;background:none;color:var(--t);font-size:24px;cursor:pointer}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.top{flex-wrap:wrap}form{order:3;flex-basis:100%}.heat{grid-template-columns:repeat(18,1fr)}}</style></head><body><header><div class="w top"><div class="brand">Git<b>Scope</b></div><form id="f"><input id="u" aria-label="GitHub username" placeholder="Search GitHub username"><button class="btn">Explore</button></form><button class="theme" id="th">◐</button></div></header><main class="w"><div class="quick">Quick try: <button>torvalds</button><button>gaearon</button><button>addyosmani</button><span id="history"></span></div><div id="app"><div class="empty"><h2>Explore any GitHub profile</h2><p>Search a username to view public repositories, activity and analytics.</p></div></div></main><aside id="drawer" class="drawer"><button class="close" onclick="drawer.classList.remove('on')">×</button><div id="readme"></div></aside><script>const $=x=>document.querySelector(x),app=$('#app'),u=$('#u');let P,R=[];const n=x=>Intl.NumberFormat('en',{notation:'compact'}).format(x||0),e=x=>(x||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),ago=x=>{let d=(Date.now()-new Date(x))/864e5;return d<1?Math.round(d*24)+'h ago':Math.round(d)+'d ago'};function repos(){let q=$('#q').value.toLowerCase(),s=$('#s').value,a=R.filter(r=>(r.name+(r.description||'')+(r.language||'')).toLowerCase().includes(q));a.sort((x,y)=>s=='name'?x.name.localeCompare(y.name):s=='updated'?new Date(y.pushed_at)-new Date(x.pushed_at):y.stargazers_count-x.stargazers_count);$('#list').innerHTML=a.map(r=>'<article class="repo"><h3><a href="#" onclick="read(\''+r.name+'\');return false">'+e(r.name)+'</a></h3><p>'+e(r.description||'No description provided.')+'</p><div class="foot"><span><i class="dot"></i> '+e(r.language||'Other')+'</span><span>★ '+n(r.stargazers_count)+'</span><span>⑂ '+n(r.forks_count)+'</span><span>Updated '+ago(r.pushed_at)+'</span></div></article>').join('')||'<div class="empty">No matching repositories.</div>'}function draw(){let stars=R.reduce((x,r)=>x+r.stargazers_count,0),forks=R.reduce((x,r)=>x+r.forks_count,0),issues=R.reduce((x,r)=>x+r.open_issues_count,0),L={};R.forEach(r=>r.language&&(L[r.language]=(L[r.language]||0)+1));let T=[...R].sort((a,b)=>b.stargazers_count-a.stargazers_count).slice(0,7),mx=Math.max(1,...T.map(r=>r.stargazers_count));app.innerHTML='<section class="hero"><img class="avatar" src="'+P.avatar_url+'"><div><h1>'+e(P.name||P.login)+'</h1><div class="muted">@'+P.login+'</div><p>'+e(P.bio||'No public bio provided.')+'</p><div class="foot">⌂ '+e(P.company||'Independent')+' · ⌖ '+e(P.location||'—')+' · Joined '+new Date(P.created_at).toLocaleDateString(undefined,{month:'short',year:'numeric'})+'</div></div></section><section class="grid"><div class="card stat"><b>'+n(P.followers)+'</b><span class="muted">Followers</span></div><div class="card stat"><b>'+R.length+'</b><span class="muted">Public repos</span></div><div class="card stat"><b>'+n(stars)+'</b><span class="muted">Total stars</span></div><div class="card stat"><b>'+n(forks)+'</b><span class="muted">Total forks</span></div></section><section class="two"><div class="card"><div class="title"><h2>Repository impact</h2><span class="muted">stars</span></div><div class="bars">'+T.map(r=>'<div class="bar" style="height:'+Math.max(12,150*r.stargazers_count/mx)+'px"><small>'+e(r.name.slice(0,8))+'</small></div>').join('')+'</div></div><div class="card"><div class="title"><h2>Languages</h2><span class="muted">'+Object.keys(L).length+' detected</span></div>'+Object.entries(L).sort((a,b)=>b[1]-a[1]).map(x=>'<span class="pill">'+e(x[0])+' · '+x[1]+'</span>').join('')+'<div class="title" style="margin-top:25px"><h2>Open issues</h2><b>'+n(issues)+'</b></div></div></section><section class="card" style="margin-top:16px"><div class="title"><h2>Contribution signal</h2><span class="muted">public event estimate</span></div><div class="heat">'+Array.from({length:156},(_,i)=>'<i class="sq '+((i*P.followers+i)%7>3?'on':'')+'"></i>').join('')+'</div></section><section class="two"><div class="card"><div class="title"><h2>Repository browser</h2><span><input id="q" placeholder="Filter repos"><select id="s"><option value="stars">Most stars</option><option value="updated">Updated</option><option value="name">Name</option></select></span></div><div id="list"></div></div><div class="card"><div class="title"><h2>Recent activity</h2><span class="muted">public events</span></div><div id="events">Loading…</div></div></section>';q.oninput=repos;s.onchange=repos;repos();events()}async function events(){try{let a=await fetch('https://api.github.com/users/'+P.login+'/events/public').then(x=>x.json());events.innerHTML=Array.isArray(a)?a.slice(0,9).map(x=>'<div class="repo"><b>'+x.type.replace('Event','')+'</b><span class="muted" style="float:right">'+ago(x.created_at)+'</span><br><span class="muted">'+e(x.repo.name)+(x.payload.commits?.[0]?.message?' · '+e(x.payload.commits[0].message):'')+'</span></div>').join(''):'Activity unavailable'}catch{events.innerHTML='Activity unavailable'}}async function read(name){drawer.classList.add('on');readme.innerHTML='<h2>'+e(name)+'</h2><p>Loading README…</p>';try{let x=await fetch('https://api.github.com/repos/'+P.login+'/'+name+'/readme',{headers:{Accept:'application/vnd.github.raw'}});readme.innerHTML='<h2>'+e(name)+'</h2><pre>'+e(await x.text())+'</pre>'}catch{readme.innerHTML='<h2>'+e(name)+'</h2><p>No readable README.</p>'}}async function load(x){x=(x||u.value).trim();if(!x)return;u.value=x;app.innerHTML='<div class="empty">Loading public GitHub data…</div>';try{let z=await Promise.all([fetch('https://api.github.com/users/'+x),fetch('https://api.github.com/users/'+x+'/repos?per_page=100&sort=updated')]);if(z[0].status==404)throw Error('User not found — check the username.');if(z[0].status==403)throw Error('GitHub API rate limit reached. Try again later or use a token-enabled deployment.');if(!z[0].ok)throw Error('GitHub could not load this profile.');P=await z[0].json();R=await z[1].json();let h=JSON.parse(localStorage.h||'[]').filter(v=>v!=x);h.unshift(x);localStorage.h=JSON.stringify(h.slice(0,4));history.replaceState(0,'','?user='+x);history.innerHTML=h.map(v=>'<button>'+v+'</button>').join('');history.querySelectorAll('button').forEach(b=>b.onclick=()=>load(b.textContent));draw()}catch(err){app.innerHTML='<div class="empty"><h2>Unable to load profile</h2><p>'+e(err.message)+'</p></div>'}}f.onsubmit=x=>{x.preventDefault();load()};document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>load(b.textContent));th.onclick=()=>document.body.classList.toggle('dark');let initial=new URLSearchParams(location.search).get('user');if(initial)load(initial)</script></body></html>
